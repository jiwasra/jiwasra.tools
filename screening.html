<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screening Awal Layanan Kesehatan Mental - jiwasra.id</title>
<style>
  :root{
    --teal:#7EA995;
    --teal-dark:#6f9c86;
    --teal-darker:#4f7863;
    --brown:#7A3413;
    --cream:#FAF7F2;
    --card:#FFFFFF;
    --text:#33312E;
    --muted:#7A7670;
    --danger:#C0392B;
    --danger-bg:#FDECEA;
    --border:#E5E0D8;
    --radius:16px;
    --shadow:0 4px 20px rgba(60,50,30,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--cream) 0%,#F1ECE3 100%);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:24px 18px 60px;
  }
  .app-admin #app{max-width:1100px;}
  .logo-wrap{text-align:center;margin-bottom:18px;}
  .logo-wrap img{max-width:220px;width:60%;height:auto;}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 24px;
    margin-bottom:18px;
    border:1px solid var(--border);
  }
  h1{
    font-size:1.35rem;
    color:var(--brown);
    text-align:center;
    margin:0 0 6px;
    line-height:1.35;
  }
  h2{
    font-size:1.1rem;
    color:var(--brown);
    margin:0 0 14px;
  }
  h3{font-size:1rem;color:var(--teal-darker);margin:18px 0 8px;}
  p{line-height:1.6;}
  .subtitle{text-align:center;color:var(--muted);margin-bottom:22px;font-size:0.92rem;}
  label{
    display:block;
    font-weight:600;
    margin:14px 0 6px;
    font-size:0.92rem;
    color:var(--text);
  }
  input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--border);
    font-size:1rem;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(126,169,149,0.25);
  }
  .radio-row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .radio-pill{
    flex:1;min-width:120px;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    text-align:center;
    cursor:pointer;
    font-weight:500;
    transition:all .15s;
    user-select:none;
  }
  .radio-pill.selected{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  .radio-pill input{display:none;}
  .btn{
    display:inline-block;
    width:100%;
    padding:14px 18px;
    border:none;
    border-radius:12px;
    background:var(--teal);
    color:#fff;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:background .15s, transform .1s;
    text-align:center;
    text-decoration:none;
  }
  .btn:hover{background:var(--teal-darker);}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{
    background:transparent;
    color:var(--teal-darker);
    border:1.5px solid var(--teal);
  }
  .btn.secondary:hover{background:rgba(126,169,149,0.1);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#a0332a;}
  .btn.wa{background:#25D366;}
  .btn.wa:hover{background:#1ebe5a;}
  .btn.small{width:auto;padding:8px 14px;font-size:0.85rem;margin:0;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .error-msg{color:var(--danger);font-size:0.88rem;margin-top:8px;min-height:18px;}
  .progress-bar{
    height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:22px;
  }
  .progress-bar-fill{height:100%;background:var(--teal);transition:width .3s;}
  .step-label{text-align:center;color:var(--muted);font-size:0.82rem;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
  .consent-box{
    background:#F5F1EA;border-radius:12px;padding:16px 18px;font-size:0.92rem;line-height:1.65;color:var(--text);margin-bottom:14px;
  }
  .consent-box strong{color:var(--brown);}
  .check-row{display:flex;align-items:flex-start;gap:10px;margin-top:12px;cursor:pointer;}
  .check-row input{width:20px;height:20px;margin-top:2px;flex-shrink:0;}
  .instruksi-box{background:#EFF6F2;border-left:4px solid var(--teal);border-radius:8px;padding:16px 18px;font-size:0.92rem;line-height:1.65;margin-bottom:8px;}
  .q-item{
    padding:16px 0;border-bottom:1px solid var(--border);
  }
  .q-item:last-child{border-bottom:none;}
  .q-num{color:var(--teal-darker);font-weight:700;font-size:0.85rem;margin-bottom:4px;}
  .q-text{font-size:0.98rem;margin-bottom:10px;font-weight:500;}
  .risk-box{
    background:var(--danger-bg);border:1.5px solid var(--danger);border-radius:12px;padding:18px 20px;margin:18px 0;
  }
  .risk-box h3{color:var(--danger);margin-top:0;}
  .risk-box a{color:var(--danger);font-weight:700;}
  .success-icon{text-align:center;font-size:3rem;margin-bottom:6px;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .small{font-size:0.85rem;}
  footer{text-align:center;color:var(--muted);font-size:0.78rem;margin-top:24px;}

  /* ADMIN */
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .admin-topbar h1{margin:0;text-align:left;font-size:1.2rem;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters input{flex:1;min-width:160px;}
  table{width:100%;border-collapse:collapse;font-size:0.88rem;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);text-transform:uppercase;font-size:0.72rem;letter-spacing:0.4px;}
  tr:hover td{background:#FAF8F4;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:0.72rem;font-weight:700;}
  .badge.tinggi{background:var(--danger-bg);color:var(--danger);}
  .badge.normal{background:#EAF3EE;color:var(--teal-darker);}
  .table-wrap{overflow-x:auto;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(30,25,15,0.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;
  }
  .modal-card{
    background:#fff;border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;
  }
  .modal-card h2{margin-top:0;}
  .kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.9rem;gap:12px;}
  .kv-row span:first-child{color:var(--muted);flex-shrink:0;}
  .kv-row span:last-child{text-align:right;font-weight:500;}
  .stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:120px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center;}
  .stat-card .num{font-size:1.5rem;font-weight:800;color:var(--teal-darker);}
  .stat-card .lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;}
  .stat-card.alert .num{color:var(--danger);}
  .loading{text-align:center;padding:40px;color:var(--muted);}
  .toolbar-right{display:flex;gap:8px;flex-wrap:wrap;}
  @media (max-width:600px){
    table{font-size:0.78rem;}
    th,td{padding:8px 5px;}
    .admin-topbar{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>

function radioPillGroup(name, options, currentValue, onChange){
  const wrap = document.createElement("div");
  wrap.className = "radio-row";
  options.forEach(opt=>{
    const pill = document.createElement("label");
    pill.className = "radio-pill" + (currentValue===opt ? " selected" : "");
    pill.innerHTML = `<input type="radio" name="${name}" value="${opt}" ${currentValue===opt?"checked":""}> ${opt}`;
    pill.querySelector("input").addEventListener("change", ()=>{
      onChange(opt);
    });
    wrap.appendChild(pill);
  });
  return wrap;
}

function updateKuesionerProgress(){
  const answered = Object.keys(state.jawaban).length;
  const pct = 55 + Math.round((answered/29)*35);
  const fill = document.getElementById("kuis-progress-fill");
  const label = document.getElementById("kuis-step-label");
  if(fill) fill.style.width = pct + "%";
  if(label) label.textContent = `Langkah 4 dari 5 - Kuesioner (${answered}/29 terjawab)`;
}

function computeScoring(){
  let skorA = 0, psikotik = false, trauma = false, suicide = false;
  SRQ_QUESTIONS.forEach(q=>{
    const ans = state.jawaban[q.no];
    if(q.section==="A" && ans==="Ya") skorA++;
    if(q.section==="B" && ans==="Ya") psikotik = true;
    if(q.section==="C" && ans==="Ya") trauma = true;
    if(q.no===17 && ans==="Ya") suicide = true;
  });
  const distresBermakna = skorA >= 6;
  const riskTinggi = suicide || psikotik;
  return {skorA, distresBermakna, psikotik, trauma, suicide, riskTinggi};
}

async function handleSubmit(){
  const unanswered = SRQ_QUESTIONS.filter(q=> !state.jawaban[q.no]);
  if(unanswered.length>0){
    document.getElementById("q-err").textContent = `Masih ada ${unanswered.length} pertanyaan yang belum dijawab (No. ${unanswered.map(q=>q.no).join(", ")}).`;
    return;
  }
  const btn = document.getElementById("btn-submit");
  btn.disabled = true;
  btn.textContent = "Mengirim...";

  const scoring = computeScoring();
  const payload = {
    action: "submit",
    timestamp: new Date().toISOString(),
    nama: state.identitas.nama,
    jenisKelamin: state.identitas.jk,
    usia: state.identitas.usia,
    pernahKonsultasi: state.identitas.pernahKonsultasi,
    jawaban: state.jawaban,
    skorA: scoring.skorA,
    distresBermakna: scoring.distresBermakna,
    indikasiPsikotik: scoring.psikotik,
    indikasiTrauma: scoring.trauma,
    indikasiBunuhDiri: scoring.suicide,
    riskTinggi: scoring.riskTinggi
  };

  try{
    if(CONFIG.SCRIPT_URL && CONFIG.SCRIPT_URL.indexOf("http")===0){
      await fetch(CONFIG.SCRIPT_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      });
    }
  }catch(err){
    console.error("Gagal mengirim ke server:", err);
  }

  state.lastScoring = scoring;
  state.step = "selesai";
  renderScreening();
}

async function fetchAdminData(){
  adminState.loading = true;
  renderAdminDashboard();
  try{
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"list", adminPass: CONFIG.ADMIN_PASSWORD})
    });
    const json = await res.json();
    adminState.data = json.data || [];
  }catch(err){
    console.error(err);
    adminState.data = [];
  }
  adminState.loading = false;
  renderAdminDashboard();
}

function filteredData(){
  return adminState.data.filter(row=>{
    if(adminState.search && !row.nama.toLowerCase().includes(adminState.search.toLowerCase())) return false;
    if(adminState.dateFilter){
      const rowDate = (row.timestamp||"").slice(0,10);
      if(rowDate !== adminState.dateFilter) return false;
    }
    if(adminState.onlyRisk && !row.riskTinggi) return false;
    return true;
  });
}

function preserveFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; }
}

function renderTable(rows){
  if(rows.length===0) return '<p class="muted center" style="padding:24px 0;">Belum ada data yang cocok.</p>';
  let html = `<table><thead><tr>
    <th>Nama</th><th>JK</th><th>Usia</th><th>Tanggal</th><th>Skor A</th><th>Status</th><th></th>
  </tr></thead><tbody>`;
  rows.forEach(row=>{
    const tgl = row.timestamp ? new Date(row.timestamp).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}) : "-";
    html += `<tr>
      <td>${escapeHtml(row.nama||"-")}</td>
      <td>${row.jenisKelamin==="Laki-laki"?"L":"P"}</td>
      <td>${row.usia||"-"}</td>

        <button class="btn small danger" id="del-${row.rowId}">Hapus</button>
      </td>
    </tr>`;
  });
  html += "</tbody></table>";
  return html;
}

      <div class="kv-row"><span>Indikasi Psikotik</span><span>${row.indikasiPsikotik ? "Ya":"Tidak"}</span></div>
      <div class="kv-row"><span>Indikasi Trauma</span><span>${row.indikasiTrauma ? "Ya":"Tidak"}</span></div>
      <div class="kv-row"><span>Indikasi Bunuh Diri</span><span>${row.indikasiBunuhDiri ? "Ya":"Tidak"}</span></div>
      <h3>Jawaban per Item</h3>
      ${jawabanHtml}
      <button class="btn secondary" id="close-modal" style="margin-top:16px;">Tutup</button>
    </div>
  `;
  document.body.appendChild(bg);
  bg.addEventListener("click", e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector("#close-modal").onclick = ()=> bg.remove();
}

async function handleDelete(row){
  if(!confirm(`Hapus data pengisian atas nama "${row.nama}"? Tindakan ini tidak dapat dibatalkan.`)) return;
  try{
    await fetch(CONFIG.SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"delete", adminPass: CONFIG.ADMIN_PASSWORD, rowId: row.rowId})
    });
    adminState.data = adminState.data.filter(r=>r.rowId !== row.rowId);
    renderAdminDashboard();
  }catch(err){
    alert("Gagal menghapus data. Coba lagi.");
  }
}

function exportCsv(){
  const rows = filteredData();
  if(rows.length===0){ alert("Tidak ada data untuk diexport."); return; }
  const headers = ["Nama","Jenis Kelamin","Usia","Pernah Konsultasi","Tanggal","Skor A","Distres Bermakna","Indikasi Psikotik","Indikasi Trauma","Indikasi Bunuh Diri","Risiko Tinggi"];
  SRQ_QUESTIONS.forEach(q=> headers.push("No."+q.no));
  const lines = [headers.join(",")];
  rows.forEach(row=>{
    const tgl = row.timestamp ? new Date(row.timestamp).toLocaleString("id-ID") : "";
    const base = [
      csvEscape(row.nama), row.jenisKelamin, row.usia, row.pernahKonsultasi, tgl,
      row.skorA, row.distresBermakna?"Ya":"Tidak", row.indikasiPsikotik?"Ya":"Tidak",
      row.indikasiTrauma?"Ya":"Tidak", row.indikasiBunuhDiri?"Ya":"Tidak", row.riskTinggi?"Ya":"Tidak"
    ];
    SRQ_QUESTIONS.forEach(q=> base.push((row.jawaban && row.jawaban[q.no]) || ""));
    lines.push(base.join(","));
  });
  const csvContent = lines.join("\n");
  const blob = new Blob(["\uFEFF"+csvContent], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `screening-jiwasra-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function csvEscape(str){
  if(str==null) return "";
  str = String(str);
  if(str.includes(",") || str.includes('"') || str.includes("\n")){
    return '"' + str.replace(/"/g,'""') + '"';
  }
  return str;
}
